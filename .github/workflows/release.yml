name: Release relay software

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          set -euo pipefail
          version=$(<VERSION)
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Test and package
        run: make release

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "dist/handrail-network-relay-${GITHUB_REF_NAME#v}.tar.gz" \
            "dist/handrail-network-relay-${GITHUB_REF_NAME#v}.tar.gz.sha256" \
            --generate-notes \
            --verify-tag
