[relay]
# Stable ID assigned by Handrail. Do not reuse it on another machine.
id = replace-with-handrail-relay-id

# Human-readable label used only in local status output.
site = Hitcents HQ

# Immutable Handrail-assigned 4via6 site identity and original IPv4 inventory.
tailscale_site_id = 1
source_ipv4_subnets = 10.20.0.0/24

# Canonical 4via6 route advertised to Tailscale for the original IPv4 subnet.
expected_subnets = fd7a:115c:a1e0:b1a:0:1:a14:0/120

# Monotonic revision generated by Handrail for this relay configuration.
config_revision = 1

# Status is refreshed at this interval. Minimum: 5 seconds.
poll_interval_seconds = 30

# systemd creates this parent directory for the service.
status_file = /run/handrail-network-relay/status.json
